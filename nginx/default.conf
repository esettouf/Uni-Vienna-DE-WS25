# Backend Flask container used for GraphQL/API
upstream flask_app {
    server backend:5000;
}

# Frontend SPA container served by nginx
upstream frontend_app {
    server frontend:80;
}

log_format upstreamlog '[$time_local] $remote_addr - $remote_user - $server_name to: $upstream_addr: $request upstream_response_time $upstream_response_time msec $msec request_time $request_time';
access_log /var/log/nginx/access.log upstreamlog;

# HTTPS server
server {
    # Specifying port and usage of SSL
    listen 8080 ssl;
    server_name localhost;
    client_max_body_size 10M;

    # Referencing SSL certificates
    ssl_certificate /etc/ssl/thgexchange.crt;
    ssl_certificate_key /etc/ssl/thgexchange.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # GraphQL/API to Flask backend
    location /graphql {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # External proxy example by Pittl
    location /orf {
        proxy_pass https://www.orf.at/;
    }
}
